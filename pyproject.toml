[project]
name = "llm-telemetry-gateway"
version = "0.1.0"
description = "Kubernetes-native proxy and telemetry gateway for local/edge LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "coverage==7.14.1",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.15.15",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["internal/sidecar"]
pythonpath = ["."]
