# Core Components & Logic
tech:
  - title: "Proxy Data Plane"
    description: "Low-overhead Go completions proxy intercepting inference requests and managing fail-closed UDS socket communication with the PII sidecar."
  - title: "PII Policy Engine"
    description: "High-throughput Python sidecar performing deterministic regex-based PII sanitization (SSN, credit cards, emails, API keys) before prompts leave the pod."
  - title: "AIOps Telemetry Evaluator"
    description: "Embedded Go telemetry loop scraping namespaced cgroups and /proc metrics, detecting threshold anomalies, and triggering Ollama for automated root cause analysis."

# Validation & Resiliency Testing
proof:
  - title: "Chaos Resilience"
    description: "System robustness validated via automated Chaos Mesh fault injections, simulating sidecar failures and network delays."
  - title: "Telemetry Pipeline"
    description: "Structured OpenTelemetry Collector pipeline processing pod metrics and streaming real-time diagnostics."
  - title: "Declarative Infrastructure"
    description: "Reproducible local deployment configurations with single-command cluster brings-up."

# Design Trade-offs & Verification Logs
reach:
  humble_pivots:
    - title: "Decoupling PII Policy to Unix Domain Socket"
      description: "Separated deterministic PII masking into an isolated Python sidecar communicating via local Unix Domain Sockets over a shared emptyDir volume. This ensures strict fail-closed security at the pod boundary without compromising core proxy throughput or exposing unsanitized prompts."
    - title: "Native Go Telemetry Scraping & In-Pod RCA"
      description: "Consolidated cgroup resource scraping, Prometheus metric exports, and Ollama RCA triggering directly inside the Go proxy. This eliminated cross-process overhead for real-time Server-Sent Events (SSE) while keeping the Python sidecar strictly focused on sub-millisecond regex masking."
    - title: "BDD as an AI Development Guardrail"
      description: "Introduced behavior-driven development via Gherkin and Godog as a strict system guardrail. This ensures that any AI-generated code modifications behave exactly as specified by the target security and routing policies, eliminating regression risks during automated development cycles."
  objective_clarity:
    description: "Objective analysis of AI-assisted incident triage under network latency and pod restart chaos injections."
  verifiable_outputs:
