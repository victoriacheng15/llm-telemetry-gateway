header:
  project_name: "LLM Telemetry Gateway"
  site_url: "https://victoriacheng15.github.io/llm-telemetry-gateway"

llms:
  objective: "A low-overhead Go completions proxy with automated PII masking, namespaced pod-level telemetry pipelines, and closed-loop AIOps diagnostics powered by Ollama."
  stack: "Go, Python, OTel Collector, Prometheus, Grafana, Kubernetes (K3s), Chaos Mesh, Ollama"
  pattern: "Data Plane Proxy with Sidecar AIOps Diagnostics"
  entry_point: "cmd/gateway/main.go (Proxy) / internal/sidecar/policy.py (AIOps)"
  persistence_strategy: "Shared emptyDir volume for Unix Domain Sockets, crash-detection state tracking, and local diagnostics logs"
  observability: "cgroups CPU, cgroups memory, OpenTelemetry, Server-Sent Events, log streaming"

# Core Components & Logic
tech:
  proxy_data_plane:
    description: "Low-overhead Go completions proxy with automated regex-based PII masking at the pod boundary."
  aiops_sidecar:
    description: "Autonomous Python diagnostics sidecar integrating with Ollama for closed-loop incident analysis."
  pod_boundary_instrumentation:
    description: "Resource telemetry extracted from namespaced cgroups to prevent host-level metric leakage."

# Validation & Resiliency Testing
proof:
  chaos_resilience:
    description: "System robustness validated via automated Chaos Mesh fault injections, simulating sidecar failures and network delays."
  telemetry_pipeline:
    description: "Structured OpenTelemetry Collector pipeline processing pod metrics and streaming real-time diagnostics."
  declarative_infrastructure:
    description: "Reproducible local deployment configurations with single-command cluster brings-up."

# Design Trade-offs & Verification Logs
reach:
  # Architecture Blueprint
  architecture_blueprint:
    diagram_ascii: |4
             ┌────────┐             ┌────────────┐
             │ Client │             │ Chaos Mesh │
             └────────┘             └────────────┘
                   │                       │
                   │ (Completions)         ├────────────────────────┐
                   ▼                       ▼ (Injects faults)       ▼ (Injects faults)
            ┌─────────────────────┐ <──────┘               ┌─────────────────────┐
            │ Gateway Proxy (Go)  │ <====================> │ Sidecar Policy (Py) │
            └─────────────────────┘      (UDS Socket)      └─────────────────────┘
                   │                                            │             │
                   │ (Sends metrics)           (Scrapes metrics)│             │ (RCA queries)
                   ▼                                            ▼             ▼
            ┌───────────┐ <─────────────────────────────────────┘      ┌────────────┐
            │ OTel      │                                              │ Ollama LLM │
            │ Collector │                                              └────────────┘
            └───────────┘
  humble_pivots:
    - title: "Sidecar vs In-Process Diagnostics"
      description: "Transitioned from writing custom in-process diagnosis logic in Go to deploying an autonomous Python sidecar sharing emptyDir volumes. This separated the data-plane proxy concerns from the diagnostic LLM integration, ensuring gateway uptime during heavy model evaluation cycles."
  objective_clarity:
    description: "Objective analysis of AI-assisted incident triage under network latency and pod restart chaos injections."
  verifiable_outputs:
    - title: "Behavior-Driven End-to-End Tests"
      terminal_output: |
