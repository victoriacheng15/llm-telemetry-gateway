<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Landing.Header.ProjectName }}</title>
  <meta name="description" content="{{ .Landing.Hero.SubHeadline }} {{ .Landing.Hero.BriefDescription }}">
  
  <!-- Web Discovery for LLM Specs -->
  <link rel="alternate" type="text/plain" href="llms.txt" title="LLM System Specification">

  <!-- Open Graph Metadata -->
  <meta property="og:title" content="{{ .Landing.Header.ProjectName }}">
  <meta property="og:description" content="{{ .Landing.Hero.SubHeadline }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Landing.Header.SiteURL }}">

  <link rel="stylesheet" href="styles.css">
</head>
<body class="showcase-container">
  <!-- Header / Hero Section -->
  <header>
    <h1>{{ .Landing.Header.ProjectName }}</h1>
    <h2>{{ .Landing.Hero.Headline }}</h2>
    <p>{{ .Landing.Hero.SubHeadline }}</p>
    <p>{{ .Landing.Hero.BriefDescription }}</p>
    <div class="cta-container">
      <a href="{{ .Landing.Hero.CTALink }}" target="_blank" rel="noopener noreferrer" class="cta-button">
        {{ .Landing.Hero.CTAText }}
      </a>
    </div>
  </header>

  <!-- Main Content Area -->
  <main>
    {{ block "content" . }}{{ end }}
  </main>

  <!-- Footer Section -->
  <footer class="py-8">
      <div class="border-t border-zinc-800 pt-6 flex justify-center items-center gap-6 text-zinc-500">
          <p class="text-xs">&copy; {{ .Year }} {{ .Landing.Footer.Author }}</p>
          <div class="flex gap-4 items-center">
              <a href="{{ .Landing.Footer.GithubLink }}" target="_blank" rel="noopener noreferrer" class="hover:text-cyan-400 transition-colors" aria-label="GitHub">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
              </a>
              <a href="{{ .Landing.Footer.LinkedinLink }}" target="_blank" rel="noopener noreferrer" class="hover:text-cyan-400 transition-colors" aria-label="LinkedIn">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
              </a>
          </div>
      </div>
  </footer>
</body>
</html>
